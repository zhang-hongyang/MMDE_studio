# NAC -> DTM dense regression, SOMA frozen backbone + dense decoder head
# Same data as nac_dtm_lora.yaml

seed_everything: 42
custom_modules_path: terratorch_integration
out_dtype: float32
trainer:
  accelerator: gpu
  devices: 1
  precision: '32'
  max_epochs: 30
  check_val_every_n_epoch: 1
  log_every_n_steps: 20
  gradient_clip_val: 0.5
  gradient_clip_algorithm: norm
  accumulate_grad_batches: 2
  deterministic: true
  benchmark: false
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/nac_dtm
      name: ni_lfm_frozen
  callbacks:
  - class_path: LearningRateMonitor
    init_args:
      logging_interval: step
  - class_path: terratorch_integration.DeterministicAugmentation
  - class_path: ModelCheckpoint
    init_args:
      dirpath: tb_logs/nac_dtm/checkpoints/ni_lfm_frozen
      monitor: val/RMSE
      mode: min
      filename: best-{epoch:02d}-{val_RMSE:.4f}
      save_top_k: 1
      save_last: true
  default_root_dir: tb_logs
data:
  class_path: terratorch.datamodules.GenericMultiModalDataModule
  init_args:
    task: regression
    batch_size: 4
    num_workers: 4
    modalities:
    - nac
    train_data_root: /home/research/code/lunar_nac_eval/data/nac_dtm
    train_label_data_root: /home/research/code/lunar_nac_eval/data/nac_dtm
    val_data_root: /home/research/code/lunar_nac_eval/data/nac_dtm
    val_label_data_root: /home/research/code/lunar_nac_eval/data/nac_dtm
    test_data_root: /home/research/code/lunar_nac_eval/data/nac_dtm
    test_label_data_root: /home/research/code/lunar_nac_eval/data/nac_dtm
    train_split: /home/research/code/lunar_nac_eval/data/nac_dtm/splits/train.txt
    val_split: /home/research/code/lunar_nac_eval/data/nac_dtm/splits/val.txt
    test_split: /home/research/code/lunar_nac_eval/data/nac_dtm/splits/val.txt
    image_grep:
      nac: '*_NAC.tif'
    label_grep: '*_DTM.tif'
    no_label_replace: -1
    no_data_replace: 0
    means:
      nac:
      - 0.053995178164645
    stds:
      nac:
      - 0.0374660347301751
    train_transform:
    - class_path: albumentations.D4
    - class_path: albumentations.pytorch.transforms.ToTensorV2
model:
  class_path: terratorch_integration.LunarPixelwiseRegressionTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: ni_lfm_v1_base
      backbone_checkpoint_path: backbone/checkpoint.pt
      backbone_cfg: backbone/config.yaml
      backbone_patch_size: 8
      backbone_modalities:
      - nac
      backbone_merge_method: concat
      necks:
      - name: SelectIndices
        indices:
        - 2
        - 5
        - 8
        - 11
      - name: LearnedTokenProjection
        output_dim: 768
      - name: ReshapeTokensToImage
        remove_cls_token: false
        h: 32
      - name: MultilayerSimpleFeaturePyramid
        out_channels: 256
      - name: FeaturePyramidNetworkNeck
        out_channel: 256
        output_ordered_dict: false
      decoder: SumFuseDeepGNDecoder
      decoder_upsample_output_size:
      - 256
      - 256
    freeze_backbone: true
    freeze_decoder: false
    loss: huber
    ignore_index: -1
    backbone_lr: 0.0003
    head_lr: 0.0003
    layer_decay: 0.85
    weight_decay: 0.0
    head_weight_decay: 0.05
    betas:
    - 0.9
    - 0.98
    warmup_steps: 130
    eta_min: 1.0e-06
